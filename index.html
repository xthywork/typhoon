 else if(e.key==='Escape'){$('#modal').classList.add('hide');S.sel=null;$('#det').classList.add('hide');drawMap()}});
/* 匯出：發佈頁面不支援直接下載，改以視窗顯示內容並可複製 */
function modal(t,txt){$('#mt').textContent=t;$('#ma').value=txt;$('#modal').classList.remove('hide');$('#ma').select()}
$('#mx').onclick=()=>$('#modal').classList.add('hide');
$('#mcp').onclick=async()=>{const a=$('#ma');a.select();try{await navigator.clipboard.writeText(a.value)}catch(_){try{document.execCommand('copy')}catch(__){}}$('#mcp').textContent='已複製';setTimeout(()=>$('#mcp').textContent='複製',1200)};
const rows=()=>{const o=[];vis().forEach(a=>bs().forEach(b=>pts(a,b).forEach(p=>o.push({a,b,p}))));return o};
$('#xc').onclick=()=>modal('多國路徑比較 CSV（官方資料）',['資料性質,機構,批次,發布時間('+TZ()+'),有效時間('+TZ()+'),預報時效h,經度,緯度,最大風速m/s,風速平均時間,中心氣壓hPa'].concat(rows().map(({a,b,p})=>['官方',a.k,'批次'+b+'（0=最新）',ft(issMs(a,b)),ft(p.time),p.ld,p.lon,p.lat,p.w,a.avg,p.p].join(','))).join('\n'));
$('#xg').onclick=()=>{const f=[];vis().forEach(a=>bs().forEach(b=>{const ps=pts(a,b);if(ps.length>1)f.push({type:'Feature',properties:{agency:a.k,batch:b,issued:issMs(a,b),source:TY().sources[a.k].url,mock:false},geometry:{type:'LineString',coordinates:ps.map(p=>[p.lon,p.lat])}});
 ps.forEach(p=>f.push({type:'Feature',properties:{agency:a.k,batch:b,hour:p.h,valid_time:p.time,issued:issMs(a,b),lead_hours:p.ld,wind_ms:p.w,wind_average:a.avg,pressure_hpa:p.p,mock:false},geometry:{type:'Point',coordinates:[p.lon,p.lat]}}))}));
 modal('預測路徑 GeoJSON（官方資料）',JSON.stringify({type:'FeatureCollection',features:f},null,1))};
$('#xs').onclick=()=>{if(!TY())return;const st={storm:TY().id,actual:S.actual,h:S.hour,issued:selectedBulletinTime(),a:[...S.on],tz:S.tz,v:mapView.view};modal('分享連結',location.href.split('#')[0]+'#'+encodeURIComponent(JSON.stringify(st)))};
function restore(){try{const state=JSON.parse(decodeURIComponent(location.hash.slice(1)));const index=D.typhoons.findIndex(t=>t.id===state.storm);if(index>=0)S.ty=index;if(Array.isArray(state.a))S.on=new Set(state.a.filter(k=>AG.some(a=>a.k===k)));if($('#tz').querySelector(`option[value="${Number(state.tz)}"]`))S.tz=String(Number(state.tz));$('#tz').value=S.tz;syncTimezoneLabel();if(TY()){if(Number.isFinite(state.actual))S.actual=nearest(cwaHistory(),state.actual,p=>p.time)?.time??null;if(Number.isFinite(state.issued))S.batch=TY().batchTimes.indexOf(nearest(TY().batchTimes,state.issued));}return state.v}catch(_){}}
async function refresh(){const oldId=TY()?.id,oldActual=S.actual,oldBatch=selectedBulletinTime(),wasLatestBatch=S.batch===0,wasLatest=!TY()||oldActual===latestPositionTime();$('#refresh').disabled=true;$('#sync').textContent='同步中…';try{const data=await DS.load();D=data;const index=D.typhoons.findIndex(t=>t.id===oldId);S.ty=index<0?0:index;const none=!TY();$('#empty').classList.toggle('hide',!none);$('#dock').classList.toggle('hide',none);$('#typSel').disabled=none;$('#typSel').value=TY()?.name||'';const ok=Object.values(D.sources).some(s=>['ok','none'].includes(s.status));$('#empty h2').textContent=ok?'目前沒有活動中的熱帶氣旋':'暫時無法取得官方資料';$('#empty p').textContent='各來源狀態可在左側查看，請稍後重新整理。';$('#sync').textContent=ft(D.synced)+' '+TZ();$('#mock').innerHTML='<span id="mockT"></span>';$('#mockT').textContent=TY()?'官方資料｜位置與風圈：CWA':'官方資料';if(none){stop();$('#stormSummary').classList.add('hide');mapView.clearWeather();S.actual=null;S.syncTime=null;S.sel=null}else{S.actual=wasLatest||index<0?latestPositionTime():nearest(cwaHistory(),oldActual,p=>p.time)?.time??null;S.batch=wasLatestBatch||index<0?0:TY().batchTimes.indexOf(nearest(TY().batchTimes,oldBatch))}all();return true}catch(error){$('#sync').textContent=D?'更新失敗，保留上次資料':'資料服務連線失敗';if(!D){$('#empty').classList.remove('hide');$('#empty h2').textContent='官方資料服務無法連線';$('#empty p').textContent='請以 python3 server.py 啟動服務，再重新整理。';$('#dock').classList.add('hide');$('#typSel').disabled=true}return false}finally{$('#refresh').disabled=false}}
new ResizeObserver(()=>{if(TY())updTl()}).observe($('#positionScale'));
document.fonts.ready.then(()=>fitSourceWidth(true));
$('#refresh').onclick=refresh;$('#lside').append($('#p_src'));updTabs();syncPanelButtons();AG.forEach(a=>{a.st='none';a.note='等待資料更新'});updAgs();
refresh().then(ok=>{if(!ok||!TY())return;const view=restore();$('#typSel').value=TY().name;all();mapView.restoreView(view)});
</script></body></html>
