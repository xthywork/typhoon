const rows=()=>{const o=[];vis().forEach(a=>bs().forEach(b=>pts(a,b).forEach(p=>o.push({a,b,p}))));return o};
$('#xc').onclick=()=>modal('多國路徑比較 CSV（模擬資料）',['資料性質,機構,批次,發布時間('+TZ()+'),有效時間('+TZ()+'),預報時效h,經度,緯度,最大風速m/s,風速平均時間,中心氣壓hPa'].concat(rows().map(({a,b,p})=>['模擬',a.k,'批次'+b+'（0=最新）',ft(issMs(a,b)),ft(D.T0+p.h*36e5),p.ld,p.lon.toFixed(2),p.lat.toFixed(2),p.w,a.avg,p.p].join(','))).join('\n'));
$('#xg').onclick=()=>{const f=[];vis().forEach(a=>bs().forEach(b=>{const ps=pts(a,b);f.push({type:'Feature',properties:{agency:a.k,batch:b,mock:true},geometry:{type:'LineString',coordinates:ps.map(p=>[+p.lon.toFixed(3),+p.lat.toFixed(3)])}});
 ps.forEach(p=>f.push({type:'Feature',properties:{agency:a.k,batch:b,hour:p.h,wind_ms:p.w,pressure_hpa:p.p,mock:true},geometry:{type:'Point',coordinates:[+p.lon.toFixed(3),+p.lat.toFixed(3)]}}))}));
 modal('預測路徑 GeoJSON（模擬資料）',JSON.stringify({type:'FeatureCollection',features:f},null,1))};
$('#xs').onclick=()=>{const st={ty:S.ty,actual:S.actual,h:S.hour,b:S.batch,o:+S.ov,a:[...S.on],bl:S.bl,tz:S.tz,v:S.v};modal('分享連結（含視角與查詢狀態）',location.href.split('#')[0]+'#'+encodeURIComponent(JSON.stringify(st)))};
function restore(){try{const s=JSON.parse(decodeURIComponent(location.hash.slice(1)));S.ty=s.ty|0;S.actual=Math.max(-48,Math.min(0,Number(s.actual)||0));S.hour=s.h;S.batch=s.b;S.ov=!!s.o;S.on=new Set(s.a);S.bl=s.bl;S.tz=s.tz;S.v=s.v;$('#tz').value=S.tz;syncTimezoneLabel()}catch(_){}}
async function refresh(){$('#refresh').disabled=true;$('#sync').textContent='同步中…';D=await DS.load();$('#refresh').disabled=false;$('#sync').textContent=ft(D.synced)+' '+TZ()+'（模擬）';
 const none=!D.typhoons.length;$('#empty').classList.toggle('hide',!none);if(none)return;
 if(S.ty>=D.typhoons.length)S.ty=0;$('#typSel').value=TY().name;all()}
$('#refresh').onclick=refresh;$('#lside').append($('#p_src'));updTabs();
syncPanelButtons();
refresh().then(()=>{restore();$('#typSel').value=TY().name;all()});setInterval(refresh,3e5);
</script></body></html>
