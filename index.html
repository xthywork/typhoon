<header><div id="headMain"><b>多國颱風路徑比較</b></div><div class="typhoon-picker"><input id="typSel" type="search" role="combobox" aria-label="搜尋或選擇颱風" aria-autocomplete="list" aria-expanded="false" aria-controls="typOptions" placeholder="搜尋颱風" autocomplete="off"><div id="typOptions" class="picker-options hide" role="listbox"></div></div>
<div id="headActions"><button id="refresh">重新整理</button>
<div class="timezone-control"><select id="tz" aria-label="時區"><option value="-10">UTC-10　夏威夷</option><option value="-8">UTC-8　北美太平洋（標準時間）</option><option value="-7">UTC-7　北美山區（標準時間）</option><option value="-6">UTC-6　北美中部（標準時間）</option><option value="-5">UTC-5　北美東部（標準時間）</option><option value="-4">UTC-4　大西洋（標準時間）</option><option value="-3">UTC-3　巴西・阿根廷</option><option value="0">UTC+0　協調世界時</option><option value="1">UTC+1　中歐（標準時間）</option><option value="2">UTC+2　東歐（標準時間）</option><option value="3">UTC+3　沙烏地阿拉伯</option><option value="4">UTC+4　阿拉伯聯合大公國</option><option value="5.5">UTC+5:30　印度</option><option value="7">UTC+7　泰國・越南</option><option value="8" selected>UTC+8　台灣・香港・新加坡</option><option value="9">UTC+9　日本・韓國</option><option value="9.5">UTC+9:30　澳洲中部（標準時間）</option><option value="10">UTC+10　澳洲東部（標準時間）</option><option value="12">UTC+12　紐西蘭（標準時間）</option></select><span id="tzLabel" aria-hidden="true">UTC+8</span></div></div></header>
<div id="main" class="cl"><aside id="lside"><div class="row panelhead"><b class="sp" style="font-size:18px">來源</b></div></aside><div id="sourceResize" role="separator" tabindex="0" aria-label="調整來源面板寬度" aria-orientation="vertical" aria-valuemin="260" aria-valuemax="560" aria-valuenow="350"></div><section id="mapc"><div id="map" role="region" aria-label="OpenStreetMap 颱風路徑地圖"></div><div id="mapStatus" role="status">地圖載入中…</div><button class="panel-edge left" id="tgL" aria-controls="lside" aria-expanded="false" aria-label="展開來源" title="展開來源">›</button><button class="panel-edge right" id="tg" aria-controls="sheet" aria-expanded="false" aria-label="展開設定面板" title="展開設定面板">‹</button>
<div id="mapUpdated" class="mu" role="status">更新 <span id="sync">—</span></div>
<div id="mock"><i>●</i> 官方資料載入中　<span id="mockT"></span></div>
<div id="tools" role="group" aria-label="地圖縮放"><button id="zi" aria-label="放大地圖" title="放大地圖">＋</button><button id="zo" aria-label="縮小地圖" title="縮小地圖">－</button><button id="zr" aria-label="重設地圖視角" title="重設地圖視角">重設</button></div>
<aside id="stormSummary" class="storm-summary hide" aria-label="颱風強度與風圈資訊"></aside>
<div id="det" class="hide"></div>
<div id="empty" class="hide"><div><h2>目前沒有活躍颱風</h2><p class="mu">請稍後按「重新整理」。</p></div></div>
<div id="dock" class="radio-dock" role="group" aria-label="雙軌時間調諧面板">
<div class="dc playback"><button id="pv" aria-label="上一個位置時間" title="上一個位置時間"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 5 2 12l9 7V5Zm11 0-9 7 9 7V5Z"/></svg></button><button id="pl" aria-label="播放實際位置時間軸" title="播放"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="icon-play"><path d="m7 4 14 8-14 8V4Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="icon-pause"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button><button id="nx" aria-label="下一個位置時間" title="下一個位置時間"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m2 5 9 7-9 7V5Zm11 0 9 7-9 7V5Z"/></svg></button></div>

<div class="tuner-window"><div class="shared-axis" aria-label="共用時間刻度"><div class="shared-time-scale"><div class="tick-bed"><div class="time-ticks" id="positionTicks"></div></div></div></div>
<div class="tuner-band band-position"><div class="band-heading"><label for="playActual"><input id="playActual" type="checkbox" checked aria-label="播放颱風位置時間軸"><span class="band-number">01</span>颱風分析位置</label><output id="tlab" for="sl"></output></div><div class="tuning-scale" id="positionScale"><div class="tick-bed" aria-hidden="true"><span class="tuning-needle"></span></div><input type="range" id="sl" min="-48" max="0" step="6" value="0" aria-label="颱風官方分析位置時間軸"></div></div>
<div class="tuner-band band-batch"><div class="band-heading"><label for="playBatch"><input id="playBatch" type="checkbox" checked aria-label="播放預報發布批次時間軸"><span class="band-number">02</span>預報發布批次</label><output id="ilab" for="is"></output></div><div class="tuning-scale" id="batchScale"><div class="tick-bed" aria-hidden="true"><span class="tuning-needle"></span></div><input type="range" id="is" min="-48" max="0" step="6" value="0" aria-label="預報發布批次時間軸"></div></div>
</div>
<div class="radio-footer"><div class="timeline-actions"><div id="sp" class="speed-options" role="group" aria-label="播放速度"><button type="button" data-speed="1600" aria-pressed="false">0.5×</button><button type="button" data-speed="800" aria-pressed="true">1×</button><button type="button" data-speed="400" aria-pressed="false">2×</button><button type="button" data-speed="200" aria-pressed="false">4×</button></div><button id="syncPlayback" type="button" aria-pressed="true" title="依同一時間游標同步播放已勾選的時間軸">同步播放</button></div><span class="radio-zone" id="radioZone">UTC+8</span></div>
</div></section>
<aside id="sheet"><div class="row panelhead"><b class="sp" style="font-size:18px">設定面板</b></div><nav id="tabs"></nav>
<div class="pn" id="p_src"><div class="source-actions"><button id="toggleAll" type="button" aria-controls="ags">全選</button></div><div id="ags"></div></div>
<div class="pn hide" id="p_lay"><div id="lys"></div><label>透明度 <input type="range" id="op" min="10" max="100" value="100"></label><label>底圖 <select id="bm"><option value="light">淺色・低彩度</option><option value="standard">自然色</option><option value="dark">深色</option></select></label></div>

<div class="pn hide" id="p_exp"><div class="row"><button class="chip" id="xc">CSV</button><button class="chip" id="xg">GeoJSON</button><button class="chip" id="xs">分享連結</button></div><div class="note">發佈頁面無法直接下載檔案，內容會顯示在視窗中供複製。</div></div></aside></div>
<div id="modal" class="hide"><div><div class="row"><b id="mt" class="sp"></b><button id="mcp">複製</button><button id="mx">關閉</button></div><textarea id="ma" readonly></textarea></div></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="map.js"></script>
<script type="module" src="bootstrap.mjs"></script></body></html>
