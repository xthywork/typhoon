const FN={CWA:'台灣中央氣象署',JMA:'日本氣象廳',KMA:'韓國氣象廳',HKO:'香港天文台',JTWC:'美國聯合颱風警報中心',CMA:'中國氣象局'};

const DS={async load(){await new Promise(r=>setTimeout(r,200));
 return{mock:true,T0:Date.UTC(2030,7,19,0),synced:Date.UTC(2030,7,19,0,30),typhoons:[

const base=(T,t)=>[T.st[0]+T.v[0]*t,T.st[1]+T.v[1]*t+.00012*t*t];
const wnd=(T,t)=>Math.max(15,T.pk*(1-Math.pow((t-T.pkH)/115,2)));
function fc(T,a,b,h){const ld=h+6*b;if(!a.max||ld>a.max)return null;const s=h/120,q=(h+6*b)/120,bp=base(T,h),w=Math.round(wnd(T,h)+a.bias+b*1.5);
 return{a:a.k,b,h,ld,lon:bp[0]+a.off[0]*s+b*.7*q,lat:bp[1]+a.off[1]*s+(b%2?-.4:.3)*b*.6*q,w,p:Math.round(1010-1.35*w),gust:a.k==='CWA'?Math.round(w*1.35):null,r30:a.r?Math.round(120+w*4):null,cone:Math.round(40+3.2*h)}}

const NB=5;let D,S={ty:0,actual:0,hour:0,hor:120,batch:0,ov:false,on:new Set(AG.filter(a=>a.max).map(a=>a.k)),hl:null,solo:false,bl:'CWA',tz:'8',op:1,chart:0,sel:null,tab:{L:'src',R:'lay'},play:null,ly:{hist:1,trk:1,pt:1,lbl:1,cone:1,r30:1,int:1,grid:1}};

const TY=()=>D.typhoons[S.ty],vis=()=>AG.filter(a=>S.on.has(a.k)&&a.max&&(!S.solo||!S.hl||S.hl===a.k)),bs=()=>S.ov&&S.batch+1<NB?[S.batch,S.batch+1]:[S.batch];
const pts=(a,b)=>{const o=[];for(let h=0;h<=S.hor;h+=12){const p=fc(TY(),a,b,h);if(p)o.push(p)}return o};
function availableHorizon(){let max=0;vis().forEach(a=>bs().forEach(b=>{const h=Math.floor((a.max-6*b)/12)*12;if(h>=0&&fc(TY(),a,b,h))max=Math.max(max,h)}));return max}
const issMs=(a,b)=>D.T0+a.iss*36e5-b*216e5,TZ=()=>{const n=Number(S.tz)||0;return 'UTC'+(n>=0?'+':'-')+Math.floor(Math.abs(n))+(Math.abs(n)%1?':30':'')};
const ft=ms=>{const d=new Date(ms+(Number(S.tz)||0)*36e5);return`${d.getUTCFullYear()}/${p2(d.getUTCMonth()+1)}/${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`};
const cls=w=>w<17.2?'熱帶性低氣壓':w<32.7?'輕度颱風':w<51?'中度颱風':'強烈颱風';
const dist=(a,b)=>{const R=6371,r=Math.PI/180,x=(b.lat-a.lat)*r,y=(b.lon-a.lon)*r,h=Math.sin(x/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const D8=['北','東北','東','東南','南','西南','西','西北'];
const mv=(a,b)=>{const r=Math.PI/180,y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);return D8[Math.round(((Math.atan2(y,x)/r+360)%360)/45)%8]};

function updTabs(){$('#tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${S.tab.R===t[0]?'on':''}">${t[1]}</button>`).join('');TABS.forEach(t=>$('#p_'+t[0]).classList.toggle('hide',S.tab.R!==t[0]))}
function updAgs(){const allSelected=AG.filter(a=>a.max).every(a=>S.on.has(a.k));$('#toggleAll').textContent=allSelected?'取消全選':'全選';$('#ags').innerHTML=AG.map(a=>`<div class="ag"><input type="checkbox" data-k="${a.k}" ${S.on.has(a.k)?'checked':''} ${a.max?'':'disabled'} aria-label="${FN[a.k]}"><i style="background:${a.c}"></i><button class="nm ${S.hl===a.k?'on':''}" data-k="${a.k}" ${a.max?'':'disabled'} title="聚焦此提供商，再點一次恢復" aria-pressed="${S.hl===a.k}">${FN[a.k]} <span>${a.k}</span></button><span class="status-light ${a.st}" role="img" tabindex="0" aria-label="${ST[a.st]}${a.note?'；'+a.note:''}" title="${ST[a.st]}${a.note?'；'+a.note:''}"></span>${a.max?`<small>${ft(issMs(a,S.batch))}</small>`:''}</div>`).join('')}

 $('#pl').textContent=S.play?'Ⅱ':'▶';$('#pl').setAttribute('aria-label',S.play?'暫停實際位置動畫':'播放實際位置動畫');$('#pl').title=S.play?'暫停':'播放';$('#pl').setAttribute('aria-pressed',!!S.play)}

function showDet(k,h,b,keep){const a=AG.find(x=>x.k===k),T=TY(),p=fc(T,a,b,h);if(!p){$('#det').classList.add('hide');return}S.sel={a:k,h,b};if(!keep)drawMap();
 const pr=h>=12?fc(T,a,b,h-12):null,m=pr?`向${mv(pr,p)}，${(dist(pr,p)/12).toFixed(0)} km/h`:'—';
 $('#det').innerHTML=`<div class="row"><b class="sp">${TY().name}（${TY().id}）</b><button id="dx" aria-label="關閉">✕</button></div><table>`+[['預報機構',FN[k]],['發布時間',ft(issMs(a,b))+' '+TZ()],['有效時間',ft(D.T0+h*36e5)+' '+TZ()],['預報時效','+'+p.ld+'h'],['中心緯度',p.lat.toFixed(2)+'°N'],['中心經度',p.lon.toFixed(2)+'°E'],['最大持續風速',p.w+' m/s（'+a.avg+'平均）'],['最大陣風',p.gust?p.gust+' m/s':'—'],['中心最低氣壓',p.p+' hPa'],['強度分級',cls(p.w)],['移動',m],['暴風圈半徑',p.r30?p.r30+' km（30 kt）':'—'],['不確定性範圍',p.h?'約 '+p.cone+' km':'—'],['資料性質','模擬資料']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')+`</table>`;
 $('#det').classList.remove('hide');$('#dx').onclick=()=>{S.sel=null;$('#det').classList.add('hide');drawMap()}}

const sourceList=$('#ags');let sourceDrag=null;
function clearSourceDetail(){S.sel=null;$('#det').classList.add('hide')}
function paintSources(y){if(!sourceDrag)return;const lo=Math.min(y,sourceDrag.y),hi=Math.max(y,sourceDrag.y);sourceList.querySelectorAll('.ag').forEach(row=>{const rect=row.getBoundingClientRect(),input=row.querySelector('input'),k=input.dataset.k;if(input.disabled||sourceDrag.visited.has(k)||hi<rect.top||lo>rect.bottom)return;sourceDrag.visited.add(k);sourceDrag.checked?S.on.add(k):S.on.delete(k)});sourceDrag.y=y;if(S.hl&&!S.on.has(S.hl))S.hl=null;clearSourceDetail();all()}

const sourceResize=$('#sourceResize');let resizePointer=null;
function resizeSources(width){const max=Math.max(260,Math.min(560,main.clientWidth-(matchMedia('(max-width:1050px)').matches?24:320+(main.classList.contains('cl')?0:350))));const value=Math.round(Math.max(260,Math.min(max,width)));main.style.setProperty('--source-width',value+'px');sourceResize.setAttribute('aria-valuenow',value);sourceResize.setAttribute('aria-valuemax',max)}

function renderTyphoonOptions(query=''){
 if(!D?.typhoons)return;const q=query.trim().toLocaleLowerCase(),items=D.typhoons.map((t,i)=>({t,i})).filter(({t})=>!q||`${t.name} ${t.id}`.toLocaleLowerCase().includes(q)),menu=$('#typOptions');menu.innerHTML='';
 if(!items.length){const empty=document.createElement('div');empty.className='picker-empty';empty.textContent='找不到符合的颱風';menu.append(empty);activeTyphoon=-1;$('#typSel').removeAttribute('aria-activedescendant')}
 else{items.forEach(({t,i})=>{const b=document.createElement('button');b.type='button';b.className='picker-option';b.id=`ty-option-${i}`;b.setAttribute('role','option');b.dataset.index=i;const name=document.createElement('span');name.textContent=t.name;const id=document.createElement('small');id.textContent=t.id;b.append(name,id);menu.append(b)});activeTyphoon=items.some(({i})=>i===S.ty)?S.ty:items[0].i;setActiveTyphoon(activeTyphoon)}

}
function closeTyphoonOptions(){const menu=$('#typOptions');menu.classList.add('hide');$('#typSel').setAttribute('aria-expanded','false');$('#typSel').removeAttribute('aria-activedescendant')}
function chooseTyphoon(i){if(!D?.typhoons[i])return;S.ty=i;S.actual=0;$('#typSel').value=TY().name;S.sel=null;$('#det').classList.add('hide');closeTyphoonOptions();all()}
$('#typSel').addEventListener('focus',()=>renderTyphoonOptions(''));
$('#typSel').addEventListener('input',e=>renderTyphoonOptions(e.target.value));
$('#typSel').addEventListener('keydown',e=>{if(e.key==='Escape'){closeTyphoonOptions();return}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if($('#typOptions').classList.contains('hide'))renderTyphoonOptions(e.target.value);const opts=[...$('#typOptions').querySelectorAll('[role="option"]')];if(!opts.length)return;const at=opts.findIndex(o=>+o.dataset.index===activeTyphoon),step=e.key==='ArrowDown'?1:-1,next=at<0?(step>0?0:opts.length-1):Math.max(0,Math.min(opts.length-1,at+step));setActiveTyphoon(+opts[next].dataset.index)}else if(e.key==='Enter'&&!$('#typOptions').classList.contains('hide')){e.preventDefault();if(activeTyphoon>=0)chooseTyphoon(activeTyphoon)}});
$('#typOptions').onmousedown=e=>{if(e.target.closest('[role="option"]'))e.preventDefault()};
